<!-- Retângulo do tamanho do papel A3 em paisagem (420 x 297 mm). Importado em (0,0), cai em cima do gabarito A3 do perfil:
     desenhe e compare com a marcação na madeira da mesa (teste dos gabaritos). -->
<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297">
  <rect x="0" y="0" width="420" height="297" fill="none" stroke="black" stroke-width="0.5"/>
</svg>
