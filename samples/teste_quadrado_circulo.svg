<?xml version="1.0" encoding="UTF-8"?>
<!-- Mesmo desenho do teste de 07/11: quadrado de 100 mm de (10,10) a (110,110) + círculo de raio 30 centrado em (60,60).
     Documento de 120 x 120 mm; importado em (0,0) deve gerar as mesmas coordenadas do teste feito à mão. -->
<svg xmlns="http://www.w3.org/2000/svg" width="120mm" height="120mm" viewBox="0 0 120 120" xmlns:c2pa="http://c2pa.org/manifest">
  <rect x="10" y="10" width="100" height="100" fill="none" stroke="black" stroke-width="0.5"/>
  <circle cx="60" cy="60" r="30" fill="none" stroke="black" stroke-width="0.5"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
